# Proposed Ideal model (HyperACE_Dyn + CARAFE + FullPAD on Dyn backbone)
# Canonical alias: same as former yolo26-ideal-hace-dynlo.yaml
nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2_DynamicConv, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_DynamicConv, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2_DynamicConv, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2_DynamicConv, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # HyperACE_Dyn: edges=4, C3k_DynamicConv low-order, e1=0.25
  - [[4, 6, 10], 2, HyperACE_Dyn, [512, 4, True, True, 0.25, 1, "both"]] # 11
  - [-1, 1, CARAFE, [2]] # 12
  - [11, 1, DownsampleConv, []] # 13
  - [[6, 11], 1, FullPAD_Tunnel, []] # 14
  - [[4, 12], 1, FullPAD_Tunnel, []] # 15
  - [[10, 13], 1, FullPAD_Tunnel, []] # 16
  - [-1, 1, CARAFE, [2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2_DynamicConv, [512, True]] # 19
  - [[-1, 11], 1, FullPAD_Tunnel, []] # 20
  - [19, 1, CARAFE, [2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 2, C3k2_DynamicConv, [256, True]] # 23
  - [12, 1, Conv, [256, 1, 1]]
  - [[23, 24], 1, FullPAD_Tunnel, []] # 25
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 20], 1, Concat, [1]]
  - [-1, 2, C3k2_DynamicConv, [512, True]] # 28
  - [[-1, 11], 1, FullPAD_Tunnel, []] # 29
  - [28, 1, Conv, [512, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 1, C3k2_DynamicConv, [1024, True, 0.5, True]] # 32
  - [[-1, 13], 1, FullPAD_Tunnel, []] # 33
  - [[25, 29, 33], 1, Detect, [nc]]
